<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Theme and PWA -->
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="PromptBox">
    <meta name="apple-mobile-web-app-title" content="PromptBox">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="AI Prompt Management System">
    <meta property="og:title" content="PromptBox">
    <meta property="og:description" content="AI Prompt Management System">
    <meta name="msapplication-TileColor" content="#111827">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>PromptBox</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        (() => {
            const storageKey = 'theme';
            const root = document.documentElement;
            let theme = null;

            try {
                theme = localStorage.getItem(storageKey);
            } catch (err) {
                theme = null;
            }

            if (!theme) {
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                theme = prefersDark ? 'default-dark' : 'default-light';
            }

            root.dataset.theme = theme;

            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
                meta.setAttribute('content', theme === 'default-light' ? '#ffffff' : '#000000');
            }
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('Service worker registered:', reg))
                    .catch(err => console.error('Service worker error:', err));
            });
        }
    </script>
</body>
</html>
